name: Deploy Magic Orb to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path("_site/index.html")
          s=p.read_text(encoding="utf-8")
          marker='<script src="app.js?v=20260929-0916"></script>'
          extras='''<script src="emotion-data-1.js"></script>
          <script src="emotion-data-2.js"></script>
          <script src="emotion-data-3b.js"></script>
          <script src="emotion-data-5.js"></script>
          <script src="emotion-data-12.js"></script>
          <script src="emotion-data-14.js"></script>
          <script src="emotion-data-15.js"></script>
          <script src="emotion-data-19.js"></script>
          <script src="emotion-de-final.js"></script>
          <script src="emotion-en-1.js"></script>
          <script src="emotion-en-2.js"></script>
          <script src="emotion-en-3.js"></script>
          <script src="emotion-en-4.js"></script>
          <script src="emotion-en-5.js"></script>
          <script src="emotion-pt-1.js"></script>
          <script src="emotion-pt-2.js"></script>
          <script src="emotion-pt-3.js"></script>
          <script src="emotion-pt-4.js"></script>
          <script src="emotion-pt-5.js"></script>
          ''' + marker
          s=s.replace(marker,extras)
          p.write_text(s,encoding="utf-8")
          PY
          cat >> _site/app.js <<'JS'
          window.EXTRA_EMOTIONS=(window.EXTRA_EMOTIONS||[]).concat([
            ["ease",["fuehlt sich leicht an"],["Leichtigkeit darf ein Hinweis sein.","Nicht alles Gute muss schwer sein."]],
            ["presence",["im moment"],["Bleib bei diesem Moment.","Hier ist gerade genug."]],
            ["certainty",["weiss was ich will"],["Klarheit darf einfach klar sein.","Du darfst deiner Entscheidung vertrauen."]],
            ["momentum",["komme voran"],["Fortschritt darf sichtbar werden.","Mach mit dem naechsten kleinen Schritt weiter."]],
            ["openness",["offen fuer etwas"],["Offenheit braucht keine Eile.","Du darfst erst einmal schauen, was kommt."]],
            ["rested",["ausgeruht"],["Nimm die neue Kraft wahr.","Du darfst sie bewusst einsetzen."]],
            ["accomplished",["etwas geschafft"],["Nimm dir einen Moment fuer das, was du geschafft hast.","Fortschritt verdient Aufmerksamkeit."]],
            ["lighthearted",["unbeschwert"],["Leichtigkeit darf bleiben.","Du darfst diesen Moment geniessen."]],
            ["curious_future",["neugierig auf morgen"],["Du darfst gespannt sein, ohne alles zu planen.","Lass etwas Raum fuer Ueberraschung."]],
            ["warmth",["warm ums herz"],["Halte diesen warmen Moment kurz fest.","Manches darf einfach gut tun."]]
          ]);

          const ritualLinesByLanguage={
            de:[
              "Für heute hast du deine Nachricht der Kugel erhalten.",
              "Nun denke darüber nach.",
              "Lass sie nach innen sinken.",
              "Wenn du die Antwort in dir hörst, schreib sie hier auf."
            ],
            en:[
              "For today, you have received your message from the orb.",
              "Now let yourself reflect on it.",
              "Let it settle quietly inside you.",
              "When you hear the answer within you, write it down here."
            ],
            pt:[
              "Por hoje, recebeste a tua mensagem da esfera.",
              "Agora deixa-te pensar sobre ela.",
              "Deixa-a assentar devagar dentro de ti.",
              "Quando ouvires a resposta dentro de ti, escreve-a aqui."
            ]
          };

          function detectInputLanguage(text){
            const n=normalizeText(text||"");
            const enSignals=["i am ","i'm ","im ","i feel ","my ","me ","can't ","cant ","don't ","dont ","frustrated","sad","angry","worried","happy","confused","nervous","lonely"];
            const ptSignals=["estou ","sinto ","me sinto ","nao ","não ","tenho ","meu ","minha ","muito ","muita ","triste","zangado","zangada","preocupado","preocupada","feliz"];
            const deSignals=["ich ","mir ","mich ","mein ","meine ","bin ","fühle ","fuehle ","nicht ","sehr ","traurig","wütend","wuetend","ängstlich","aengstlich"];
            const score=(signals)=>signals.reduce((sum,s)=>sum+(n.includes(normalizeText(s))?1:0),0);
            const scores={en:score(enSignals),pt:score(ptSignals),de:score(deSignals)};
            const best=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
            return best[1]>0?best[0]:null;
          }

          function findLanguageEmotion(text){
            const normalized=normalizeText(text||"");
            const detected=detectInputLanguage(text);
            const ordered=detected
              ? [[detected,detected==="en"?(window.EMOTION_EN||[]):detected==="pt"?(window.EMOTION_PT||[]):(window.EXTRA_EMOTIONS||[])]]
              : [
                  ["en",window.EMOTION_EN||[]],
                  ["pt",window.EMOTION_PT||[]],
                  ["de",window.EXTRA_EMOTIONS||[]]
                ];

            for(const [lang,pack] of ordered){
              for(const item of pack){
                const words=item[1]||[];
                if(words.some(word=>normalized.includes(normalizeText(word)))){
                  return {lang,lines:item[2]};
                }
              }
            }

            if(detected){
              const fallbackPack=detected==="en"?(window.EMOTION_EN||[]):detected==="pt"?(window.EMOTION_PT||[]):(window.EXTRA_EMOTIONS||[]);
              if(fallbackPack.length){
                const general=fallbackPack.find(item=>item[0]==="calm"||item[0]==="clarity"||item[0]==="hope")||fallbackPack[0];
                return {lang:detected,lines:general[2]};
              }
            }
            return null;
          }

          orb.addEventListener("click",()=>{
            const value=thought.value.trim();
            if(!value) return;
            const hit=findLanguageEmotion(value);
            if(!hit) return;

            Object.keys(responses).forEach(key=>{responses[key]=hit.lines;});

            const nextLines=ritualLinesByLanguage[hit.lang]||ritualLinesByLanguage.de;
            reflectionLines.splice(0,reflectionLines.length,...nextLines);

            const sealedLines=sealedMessage.querySelectorAll("p");
            if(hit.lang==="en"){
              boxSecret.placeholder="Write your secret here …";
              sealButton.textContent="Give it to the universe";
              if(sealedLines[0]) sealedLines[0].textContent="Your secret is gone.";
              if(sealedLines[1]) sealedLines[1].textContent="Locked away forever.";
              if(sealedLines[2]) sealedLines[2].textContent="Given to the universe.";
              hint.textContent="";
            }else if(hit.lang==="pt"){
              boxSecret.placeholder="Escreve aqui o teu segredo …";
              sealButton.textContent="Entregar ao universo";
              if(sealedLines[0]) sealedLines[0].textContent="O teu segredo partiu.";
              if(sealedLines[1]) sealedLines[1].textContent="Fechado para sempre.";
              if(sealedLines[2]) sealedLines[2].textContent="Entregue ao universo.";
              hint.textContent="";
            }else{
              boxSecret.placeholder="Schreib dein Geheimnis hier hinein …";
              sealButton.textContent="Ans Universum übergeben";
              if(sealedLines[0]) sealedLines[0].textContent="Dein Geheimnis ist fort.";
              if(sealedLines[1]) sealedLines[1].textContent="Für immer verschlossen.";
              if(sealedLines[2]) sealedLines[2].textContent="Ans Universum übergeben.";
              hint.textContent="";
            }
          },true);

          JS

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
